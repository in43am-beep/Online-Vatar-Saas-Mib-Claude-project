name: build-windows

# The repo holds avatar-production-mib.zip (source) at root.
# Push a tag like v1.0.0 -> builds AvatarProductionByMIB.exe -> attaches it
# to a public GitHub Release (no login needed to download).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        shell: pwsh
        run: Expand-Archive -Path avatar-production-mib.zip -DestinationPath src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/avatar-production-mib/requirements.txt pyinstaller

      - name: Build exe (one file)
        working-directory: src/avatar-production-mib
        run: pyinstaller build-exe.spec

      - name: Attach exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/avatar-production-mib/dist/AvatarProductionByMIB.exe
          body: "Avatar Production by MIB — Windows build. Download the exe, double-click to run."
